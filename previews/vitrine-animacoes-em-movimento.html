<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ygdria — galeria completa de animações</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#0b0815;color:#f7e8bb}
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(circle at 50% 0%,#302144,#0b0815 48%);min-width:320px}
    header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:16px 22px;background:rgba(12,8,22,.95);border-bottom:1px solid #7555a1;backdrop-filter:blur(12px)}
    h1{margin:0;font:700 clamp(19px,3vw,31px)/1.05 Georgia,serif;letter-spacing:.04em;color:#ffe7a6}
    header p{margin:6px 0 0;color:#cdbdda;font-size:12px;line-height:1.4}
    button,.filter{border:1px solid #e9c871;border-radius:9px;padding:9px 12px;color:#21132d;background:#f4d378;font-weight:800;cursor:pointer}
    button:focus-visible,.filter:focus-visible{outline:2px solid #fff3ae;outline-offset:2px}
    main{width:min(1850px,100%);margin:auto;padding:18px}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:16px;padding:12px 14px;border:1px solid #65488b;border-radius:12px;background:rgba(26,17,43,.9)}
    .filters{display:flex;gap:7px;flex-wrap:wrap}.filter{padding:7px 10px;background:#211634;color:#eedeb8;border-color:#644687;font-size:11px}.filter.active{background:#e9c871;color:#21132d}
    .stats{color:#c5b6d6;font-size:12px}.legend{display:flex;gap:10px;flex-wrap:wrap;color:#cbbbd9;font-size:10px}.legend span{display:inline-flex;align-items:center;gap:4px}.legend i{display:inline-block;width:18px;border-top:1px dashed #f2cb71}.legend i.eye{border-color:#74d8dc}
    .character{margin:0 0 15px;padding:13px;border:1px solid #63468a;border-radius:14px;background:linear-gradient(135deg,rgba(35,22,56,.96),rgba(18,12,30,.96));box-shadow:0 8px 22px rgba(0,0,0,.2)}
    .character[data-category="enemy"]{border-color:#87545b}.character[data-category="summon"]{border-color:#528b91}
    .identity{display:flex;align-items:baseline;gap:9px;margin:0 0 9px}.identity h2{margin:0;font:700 20px/1.1 Georgia,serif;color:#ffebb5}.identity small{color:#baa8ca;font-size:11px}.identity em{margin-left:auto;color:#d6bedb;font-size:10px;font-style:normal;text-transform:uppercase;letter-spacing:.08em}
    .actions{display:grid;grid-template-columns:repeat(6,minmax(132px,1fr));gap:8px}
    .action{min-width:0;overflow:hidden;border:1px solid #564077;border-radius:10px;background:#100b1c}.action[data-action="defeat"]{border-color:#ac6874}.action[data-action="victory"]{border-color:#c89948}
    .label{display:flex;justify-content:space-between;gap:5px;padding:7px 8px 5px;color:#f6dfb1;font-size:11px;font-weight:800}.label small{color:#b9aac5;font-size:9px;font-weight:500}
    .stage{position:relative;height:145px;overflow:hidden;background:radial-gradient(ellipse at 50% 83%,rgba(213,171,78,.16),transparent 38%),linear-gradient(180deg,rgba(255,255,255,.035),rgba(0,0,0,.24))}
    .stage:before,.stage:after{content:"";position:absolute;left:8%;right:8%;z-index:3;pointer-events:none}.stage:before{bottom:19px;border-top:1px dashed rgba(247,207,113,.76)}.stage:after{top:50px;border-top:1px dashed rgba(116,216,220,.55)}
    .stage .line-label{position:absolute;right:6px;z-index:4;color:rgba(255,231,166,.58);font-size:8px;letter-spacing:.03em}.stage .floor{bottom:22px}.stage .eyes{top:53px;color:rgba(116,216,220,.64)}
    .sprite{position:absolute;inset:0;background-repeat:no-repeat;background-color:transparent;background-position:0 0;background-size:300% 200%;transform-origin:50% 100%;filter:drop-shadow(0 7px 7px rgba(0,0,0,.6));will-change:background-position,transform}
    .sprite.defeat{animation:galleryDefeat .46s cubic-bezier(.2,.76,.24,1) both;transform-origin:50% 100%}.sprite.defeat.flip{animation-name:galleryDefeatFlip}
    .sprite.fallback{background-size:contain;background-position:center;background-repeat:no-repeat}
    .meta{padding:5px 8px 7px;color:#aa9bbb;font-size:9px;line-height:1.2}.meta strong{color:#e2c978;font-weight:700}.status{color:#74d8dc}
    .hidden{display:none!important}.empty{padding:24px;text-align:center;color:#c6b6d2;border:1px dashed #63468a;border-radius:12px}
    @keyframes galleryDefeat{0%{transform:rotate(0) translate3d(0,0,0);opacity:1}62%{transform:rotate(58deg) translate3d(4px,4px,0);opacity:1}100%{transform:rotate(76deg) translate3d(7px,9px,0);opacity:.82}}
    @keyframes galleryDefeatFlip{0%{transform:scaleX(-1) rotate(0) translate3d(0,0,0);opacity:1}62%{transform:scaleX(-1) rotate(-58deg) translate3d(-4px,4px,0);opacity:1}100%{transform:scaleX(-1) rotate(-76deg) translate3d(-7px,9px,0);opacity:.82}}
    @media (max-width:1150px){.actions{grid-template-columns:repeat(3,minmax(145px,1fr))}}
    @media (max-width:620px){header{align-items:flex-start;padding:13px 12px}header button{font-size:10px;padding:8px}.identity h2{font-size:17px}.identity em{display:none}main{padding:10px}.character{padding:9px}.actions{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.stage{height:126px}.stage:after{top:45px}}
    @media (prefers-reduced-motion:reduce){.sprite.defeat{animation:none;transform:rotate(76deg) translate3d(7px,9px,0);opacity:.82}}
  </style>
</head>
<body>
  <header><div><h1>Galeria de animações · Ygdria</h1><p>Todos os personagens, estados e pontos de referência. O chão é dourado; a linha dos olhos é azul.</p></div><button id="toggle" type="button">Pausar</button></header>
  <main>
    <div class="toolbar"><div class="filters" role="group" aria-label="Filtrar elenco"><button class="filter active" data-filter="all">Todos</button><button class="filter" data-filter="hero">Cartas</button><button class="filter" data-filter="enemy">Inimigos</button><button class="filter" data-filter="summon">Invocações</button></div><div class="stats" id="stats">Carregando matriz…</div><div class="legend"><span><i></i> pés no chão</span><span><i class="eye"></i> olhos</span><span>sem escala por quadro</span></div></div>
    <div id="gallery" aria-live="polite"></div>
  </main>
  <script src="../v10-animations.js?v=10.0.30"></script>
  <script>
    const heroNames={luz:'Galatéia',humanos:'Berenice',agua:'Maril',fogo:'Lucius',natureza:'Ninfa Queen',terra:'Kallendra',areia:'Rashid',sombras:'Berenice das Sombras',raio:'Mardogear',vento:'Sophitia',chuvas:'Regnar',gelo:'Blizzardo',gareth:'Gareth',cedric:'Cedric',elizier:'Elizier',roland:'Roland','berenice-jovem':'Berenice Jovem','galateia-jovem':'Galatéia Jovem','adriel-jovem':'Adriel Jovem','acqua-jovem':'Acqua Jovem',jules:'Jules',kalander:'Kalander',bernyce:'Bernyce',julius:'Julius'};
    const heroIds=Object.keys(heroNames);
    const enemyNames={capitao:'Capitão',soldado1:'Soldado 1',soldado2:'Soldado 2','sold-bib1':'Soldado Biblioteca 1','sold-bib2':'Soldado Biblioteca 2','sold-bib3':'Soldado Biblioteca 3',infantaria:'Infantaria',cavalaria:'Cavalaria',comandante:'Comandante',trono:'Soldado do Trono',morto:'Cavaleiro Morto',vulto:'Vulto Sombrio','slime-cereja':'Slime de Cerejeira','lobo-raivoso':'Lobo Raivoso',espectro:'Espectro Sombrio','human-guard':'Guarda Humano','rune-slime':'Slime Rúnico','shadow-wolf':'Lobo das Sombras','cursed-wraith':'Espectro Amaldiçoado','stone-sentinel':'Sentinela de Pedra','crimson-dragon':'Dragão Carmesim'};
    const enemyIds=Object.keys(enemyNames),summonNames={golem:'Golem invocado',harpy:'Harpia invocada'};
    const actionNames={idle:'Idle',attack:'Ataque',cast:'Magia',hit:'Dano',victory:'Vitória',defeat:'Derrota'};
    const enemyIdleIds=new Set(['morto','vulto','espectro','slime-cereja','lobo-raivoso','human-guard','rune-slime','shadow-wolf','cursed-wraith','stone-sentinel','crimson-dragon']);
    const frameOrders={idle:[0,1,2,3,4,5,4,3,2,1],attack:[2,3,1],cast:[1,2,3],hit:[4,5],victory:[5],defeat:[5]};
    const gallery=document.getElementById('gallery'),sprites=[];
    function esc(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    function heroSpec(id,action){const spec=window.YGDRIA_V10_ANIMATIONS?.[id]?.[action];return spec?{...spec,src:spec.src.startsWith('../')?spec.src:`../${spec.src}`,category:'hero',displayScale:Number(spec.displayScale||1)}:null;}
    function enemySpec(id,action){const grid=['human-guard','rune-slime','shadow-wolf','cursed-wraith','stone-sentinel','crimson-dragon'].includes(id)?[2,3]:[3,2];const source=action==='idle'&&enemyIdleIds.has(id)?`../assets/enemies/runtime-v10/${id}/idle/processed/sheet-transparent.png`:`../assets/enemies/runtime-v10/${id}/processed/sheet-transparent.png`;return{src:source,cols:grid[0],rows:grid[1],frames:6,frameOrder:frameOrders[action],duration:action==='idle'?2100:action==='defeat'?460:720,displayScale:1,category:'enemy'};}
    function summonSpec(id,action){const data={golem:{src:'../assets/summons/golem/attack-2x3.png',cols:2,rows:3},harpy:{src:'../assets/summons/harpy/attack-2x3.png',cols:3,rows:2}}[id];return{...data,frames:6,frameOrder:action==='idle'?[0,5]:action==='defeat'?[5]:action==='victory'?[5]:[0,1,2,3,4,5],duration:action==='idle'?1500:640,displayScale:1,category:'summon'};}
    function makeSpec(entry,action){if(entry.category==='hero'){if(action==='defeat'){const hit=heroSpec(entry.id,'hit');return hit&&{...hit,sourceAction:'hit',frameOrder:[3],duration:460};}return heroSpec(entry.id,action);}return entry.category==='enemy'?enemySpec(entry.id,action):summonSpec(entry.id,action);}
    function addAction(parent,entry,action){const spec=makeSpec(entry,action),card=document.createElement('article');card.className='action';card.dataset.action=action;const label=actionNames[action],sourceLabel=spec?.sourceAction?` · ${spec.sourceAction}`:'';card.innerHTML=`<div class="label"><span>${label}</span><small>${sourceLabel}</small></div><div class="stage"><span class="line-label floor">pés</span><span class="line-label eyes">olhos</span><div class="sprite" aria-label="${esc(entry.name)}: ${label}"></div></div><div class="meta"><strong>${spec?'folha real':'ausente'}</strong> · ${spec?`${spec.frames} quadros · ${spec.duration}ms`:'verificar'} <span class="status">${action==='defeat'&&entry.category==='enemy'?'pose terminal':''}</span></div>`;const sprite=card.querySelector('.sprite');if(spec){sprite.style.backgroundImage=`url('${spec.src}')`;sprite.style.backgroundSize=`${spec.cols*100}% ${spec.rows*100}%`;sprite.style.transform=`scale(${spec.displayScale})`;sprite.dataset.frames=spec.frames;sprite.dataset.cols=spec.cols;sprite.dataset.rows=spec.rows;sprite.dataset.order=JSON.stringify(spec.frameOrder||[]);if(action==='defeat'){sprite.classList.add('defeat');}sprites.push({sprite,spec,action,frame:-1});}else sprite.classList.add('fallback');parent.append(card);}
    function addEntry(entry){const section=document.createElement('section');section.className='character';section.dataset.category=entry.category;const categoryLabel={hero:'carta',enemy:'inimigo',summon:'invocação'}[entry.category];section.innerHTML=`<div class="identity"><h2>${esc(entry.name)}</h2><small>${esc(entry.id)}</small><em>${categoryLabel}</em></div><div class="actions"></div>`;const actionsEl=section.querySelector('.actions');['idle','attack','cast','hit','victory','defeat'].forEach(action=>addAction(actionsEl,entry,action));gallery.append(section);}
    heroIds.forEach(id=>addEntry({id,name:heroNames[id],category:'hero'}));enemyIds.forEach(id=>addEntry({id,name:enemyNames[id],category:'enemy'}));Object.keys(summonNames).forEach(id=>addEntry({id,name:summonNames[id],category:'summon'}));
    document.getElementById('stats').textContent=`${heroIds.length} cartas · ${enemyIds.length} inimigos · ${Object.keys(summonNames).length} invocações · ${sprites.length} estados`;
    let paused=false;document.getElementById('toggle').addEventListener('click',event=>{paused=!paused;event.currentTarget.textContent=paused?'Retomar':'Pausar';});document.querySelectorAll('.filter').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.filter').forEach(item=>item.classList.toggle('active',item===button));const filter=button.dataset.filter;document.querySelectorAll('.character').forEach(section=>section.classList.toggle('hidden',filter!=='all'&&section.dataset.category!==filter));}));
    function render(now){if(!paused){for(const item of sprites){if(item.action==='defeat')continue;const order=item.spec.frameOrder?.length?item.spec.frameOrder:null,count=order?order.length:item.spec.frames,frame=Math.floor(now/(item.spec.duration/count))%count;if(frame!==item.frame){item.frame=frame;const source=order?order[frame]:frame,col=source%item.spec.cols,row=Math.floor(source/item.spec.cols);item.sprite.style.backgroundPosition=`${item.spec.cols===1?0:col*100/(item.spec.cols-1)}% ${item.spec.rows===1?0:row*100/(item.spec.rows-1)}%`;}}}requestAnimationFrame(render);}
    requestAnimationFrame(render);
  </script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ygdria — vitrine de animações</title>
  <style>
    :root { color-scheme: dark; font-family: Georgia, serif; background: #0d0918; color: #f9e0a0; }
    * { box-sizing: border-box; }
    body { margin: 0; background: radial-gradient(circle at 50% 0%, #29203e, #0d0918 45%); }
    header { position: sticky; top: 0; z-index: 2; display: flex; gap: 16px; align-items: center; justify-content: space-between; padding: 16px 24px; background: rgba(13,9,24,.94); border-bottom: 1px solid #7052a3; backdrop-filter: blur(10px); }
    h1 { margin: 0; font-size: clamp(18px, 3vw, 30px); letter-spacing: .04em; }
    p { margin: 5px 0 0; color: #c8b7d9; font: 14px/1.35 system-ui, sans-serif; }
    button { border: 1px solid #f7d67c; border-radius: 8px; padding: 10px 14px; color: #201229; background: #f7d67c; font-weight: 800; cursor: pointer; }
    main { width: min(1800px, 100%); margin: 0 auto; padding: 20px; }
    .character { margin: 0 0 16px; padding: 14px; border: 1px solid #64458e; border-radius: 14px; background: rgba(28,19,45,.9); }
    .identity { display: flex; gap: 10px; align-items: baseline; margin: 0 0 10px; }
    .identity h2 { margin: 0; font-size: 22px; }
    .identity small { color: #baa5d1; font: 14px system-ui, sans-serif; }
    .actions { display: grid; grid-template-columns: repeat(5, minmax(130px, 1fr)); gap: 10px; }
    .action { min-width: 0; border: 2px solid #5d4184; border-radius: 10px; overflow: hidden; background: #130d21; }
    .action.changed { border-color: #48edcf; box-shadow: 0 0 18px rgba(72,237,207,.18); }
    .label { display: flex; justify-content: space-between; padding: 7px 9px; color: #f6dfb1; font: 800 12px system-ui, sans-serif; }
    .tag { color: #48edcf; font-size: 10px; }
    .sprite { aspect-ratio: 1; width: 100%; background-repeat: no-repeat; background-color: #140d22; image-rendering: auto; }
    @media (max-width: 850px) { main { padding: 10px; } .actions { grid-template-columns: repeat(2, minmax(0, 1fr)); } .character { padding: 10px; } }
  </style>
</head>
<body>
  <header>
    <div><h1>Vitrine em movimento — Ygdria</h1><p>As 24 personagens e suas cinco ações em reprodução contínua.</p></div>
    <button id="toggle" type="button">Pausar animações</button>
  </header>
  <main id="gallery" aria-live="polite"></main>
  <script src="../v10-animations.js?v=10.0.21"></script>
  <script>
    const characters = [
      ['Galatéia','luz'],['Berenice','humanos'],['Maril','agua'],['Lucius','fogo'],['Ninfa Queen','natureza'],['Kallendra','terra'],
      ['Rashid','areia'],['Berenice das Sombras','sombras'],['Mardogear','raio'],['Sophitia','vento'],['Regnar','chuvas'],['Blizzardo','gelo'],
      ['Gareth','gareth'],['Cedric','cedric'],['Elizier','elizier'],['Roland','roland'],['Berenice Jovem','berenice-jovem'],['Galatéia Jovem','galateia-jovem'],
      ['Adriel Jovem','adriel-jovem'],['Acqua Jovem','acqua-jovem'],['Jules','jules'],['Kalander','kalander'],['Bernyce','bernyce'],['Julius','julius']
    ];
    const actions = [
      ['Idle','idle',4,2,2,2400], ['Ataque','attack',6,3,2,720], ['Conjuração','cast',6,3,2,840], ['Dano','hit',4,2,2,360], ['Vitória','victory',4,2,2,1200]
    ];
    const changed = new Set(['luz:attack','luz:cast','humanos:attack','humanos:cast','fogo:attack','fogo:cast','natureza:attack','natureza:cast','areia:idle','sombras:attack','sombras:cast','raio:attack','raio:cast','chuvas:attack','chuvas:cast','gelo:attack','gelo:cast','gareth:attack','julius:attack','julius:cast']);
    /* Mesmo contrato de normalização aplicado pelo jogo: base é o repouso;
       a origem é sempre a linha dos pés. */
    const actionScale = {
      'acqua-jovem':{attack:.8398,hit:.7652,victory:.9396},agua:{attack:1.0344,cast:1.07,hit:1.0982},areia:{attack:1.0834,cast:1.0858,hit:1.0285,victory:1.0535},
      'berenice-jovem':{victory:.9662},bernyce:{attack:1.0272,cast:1.0315,hit:.9305,victory:1.0499},cedric:{attack:1.1456,cast:1.0793,hit:1.0518,victory:1.0545},
      chuvas:{attack:.805,hit:1.2485},elizier:{attack:1.1281,cast:1.034,hit:1.0853,victory:1.0381},fogo:{attack:.6287,cast:1.0441,hit:.9568},
      'galateia-jovem':{attack:.9742,cast:.972,victory:1.0391},gareth:{attack:.8071,cast:1.0367,hit:1.0212},gelo:{attack:.9769,cast:.8805,hit:1.1637,victory:1.0698},
      humanos:{attack:.6331,cast:.6236,hit:1.0629,victory:1.0763},jules:{attack:1.0333,cast:1.0342,hit:.9361,victory:1.037},julius:{attack:.9372,cast:.9849,hit:1.0165},
      kalander:{attack:1.0338,hit:.9806,victory:1.043},luz:{attack:.7015,cast:.6793},natureza:{attack:1.0775,cast:1.1599,hit:.9549,victory:.9489},
      raio:{attack:.9437,cast:.9503,hit:1.2453,victory:.9597},roland:{attack:1.124,cast:1.0538,hit:1.1173},sombras:{attack:.6597,cast:.6563,hit:.9757},
      terra:{attack:1.0811,hit:1.0352},vento:{cast:1.0319,hit:1.1514,victory:1.0431}
    };
    const gallery = document.getElementById('gallery');
    const sprites = [];
    for (const [name, id] of characters) {
      const section = document.createElement('section'); section.className = 'character';
      section.innerHTML = `<div class="identity"><h2>${name}</h2><small>${id}</small></div><div class="actions"></div>`;
      const actionsEl = section.querySelector('.actions');
      for (const [label, action, frames, cols, rows, duration] of actions) {
        const key = `${id}:${action}`; const card = document.createElement('article');
        card.className = `action${changed.has(key) ? ' changed' : ''}`;
        card.innerHTML = `<div class="label"><span>${label}</span>${changed.has(key) ? '<span class="tag">CORRIGIDA</span>' : ''}</div><div class="sprite" aria-label="${name}: ${label}"></div>`;
        const sprite = card.querySelector('.sprite');
        const grid = cols === 3 ? '3x2' : '2x2';
        sprite.style.backgroundImage = `url('../assets/characters/runtime-v10/${id}/${action}-${grid}.png')`;
        sprite.style.backgroundSize = `${cols * 100}% ${rows * 100}%`;
        const base = window.YGDRIA_V10_ANIMATIONS?.[id]?.[action]?.displayScale || 1;
        const normalized = base * (actionScale[id]?.[action] || 1);
        sprite.style.transform = `scale(${normalized})`;
        sprite.style.transformOrigin = '50% 100%';
        sprites.push({ sprite, frames, cols, rows, duration, frame: -1 }); actionsEl.append(card);
      }
      gallery.append(section);
    }
    let paused = false; const toggle = document.getElementById('toggle');
    toggle.addEventListener('click', () => { paused = !paused; toggle.textContent = paused ? 'Retomar animações' : 'Pausar animações'; });
    function render(now) {
      if (!paused) for (const item of sprites) {
        const frame = Math.floor(now / (item.duration / item.frames)) % item.frames;
        if (frame !== item.frame) {
          item.frame = frame; const col = frame % item.cols; const row = Math.floor(frame / item.cols);
          const x = item.cols === 1 ? 0 : col * 100 / (item.cols - 1); const y = item.rows === 1 ? 0 : row * 100 / (item.rows - 1);
          item.sprite.style.backgroundPosition = `${x}% ${y}%`;
        }
      }
      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);
  </script>
</body>
</html>

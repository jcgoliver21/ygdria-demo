<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HUD ilustrado — comparação</title>
<style>html{background:#08070c;color:#f6e8d8;font-family:Georgia,serif}body{margin:0}header{position:sticky;top:0;z-index:2;background:#100b13f5;border-bottom:1px solid #9e7466;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:17px;margin:0}a{color:#ffc3dc}nav{display:flex;justify-content:center;gap:8px;padding:14px}button{padding:10px 18px;background:#1d1421;color:#eedad0;border:1px solid #916b61;font:14px Georgia;cursor:pointer}button[aria-pressed=true]{border-color:#ffc2dd;color:#ffc2dd;background:#381629}.pair{display:grid;grid-template-columns:1fr 1fr;max-width:1600px;margin:auto;gap:14px;padding:0 12px}figure{margin:0;min-width:0}figcaption{text-align:center;padding:12px;color:#e0bba5;font-size:14px}img{display:block;width:100%;height:auto}p{max-width:850px;margin:18px auto;padding:0 18px;color:#c1b2bc;font:13px/1.5 Georgia}#phone{display:none;max-width:430px;margin:auto}@media(max-width:700px){.pair{display:block;padding:0}.pair figure{display:none}body[data-view=game] #game,body[data-view=reference] #reference{display:block}body[data-view=phone] .pair{display:none}body[data-view=phone] #phone{display:block}header a{font-size:12px}}@media(min-width:701px){nav{display:none}}</style></head>
<body data-view="game"><header><h1>HUD ilustrado · v11.1.2</h1><a href="../index.html">Abrir o jogo</a></header><nav aria-label="Comparação"><button data-view="game" aria-pressed="true">Jogo real</button><button data-view="reference" aria-pressed="false">Referência</button><button data-view="phone" aria-pressed="false">Celular</button></nav>
<main class="pair"><figure id="reference"><figcaption>Ilustração aprovada</figcaption><img src="../assets/previews/hud-aprovado.png" alt="Referência ilustrada aprovada pelo usuário"></figure><figure id="game"><figcaption>Captura do jogo implementado — 1024 × 1536</figcaption><img src="../assets/previews/hud-implementado.png" alt="Captura real do novo HUD em uma batalha na Torre"></figure></main><figure id="phone"><figcaption>Captura real — 390 × 844</figcaption><img src="../assets/previews/hud-implementado-mobile.png" alt="HUD no navegador em tamanho de celular"></figure>
<p>A imagem do jogo foi capturada no navegador, com sprites, tabuleiro e controles reais. Personagens, formação, adversário e valores dependem da partida. As cartas aparecem inteiras; os controles mantêm as funções existentes do jogo.</p>
<script>document.querySelectorAll('button[data-view]').forEach(button=>button.addEventListener('click',()=>{document.body.dataset.view=button.dataset.view;document.querySelectorAll('button[data-view]').forEach(other=>other.setAttribute('aria-pressed',String(other===button)));}));</script></body></html>

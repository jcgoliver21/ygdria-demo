name: v10 quality gates

on:
  push:
    branches: [main, codex/v10]
  pull_request:

permissions:
  contents: read
  pages: read

concurrency:
  group: v10-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts-and-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start static server
        run: python3 -m http.server 4177 --bind 127.0.0.1 > /tmp/ygdria-server.log 2>&1 &
      - name: Wait for static server
        run: |
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4177/play.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/ygdria-server.log
          exit 1
      - name: Run desktop and mobile browser tests
        env:
          BASE_URL: http://127.0.0.1:4177
        run: pnpm run test:e2e
      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v10-playwright-evidence
          path: test-results/
          retention-days: 7

  production-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [contracts-and-assets, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Wait for GitHub Pages v10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..120}; do
            published_sha="$(curl --fail --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              'https://api.github.com/repos/jcgoliver21/ygdria-demo/pages/builds/latest' \
              | jq -r 'select(.status == "built") | .commit')"
            if [ "${published_sha}" = "${GITHUB_SHA}" ] && \
               curl --fail --silent --show-error \
                 "https://jcgoliver21.github.io/ygdria-demo/play.html?ci=${GITHUB_SHA}" \
                 | grep -q 'game-v10.js?v=10.0.28'; then
              exit 0
            fi
            sleep 5
          done
          echo "GitHub Pages did not publish exact SHA ${GITHUB_SHA} within 10 minutes."
          exit 1
      - name: Smoke test the published game
        env:
          BASE_URL: https://jcgoliver21.github.io/ygdria-demo
          PRODUCTION_QA: '1'
        run: pnpm run test:e2e:production
      - name: Upload production evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v10-production-evidence
          path: test-results/
          retention-days: 7
